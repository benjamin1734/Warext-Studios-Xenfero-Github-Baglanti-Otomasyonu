name: Publish v0.9.3 Alpha 12 pre-release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-pre-release.yml'
      - 'tools/build-xenforo-release.py'
      - 'release/v0.9.3-alpha.12/**'
      - 'src/addons/Warext/GitHubSync/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v0.9.3-alpha.12
      ZIP_NAME: Warext-GitHub-Sync-v0.9.3-Alpha12-install.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate XenForo templates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('src/addons/Warext/GitHubSync/_output/templates')
          errors = []
          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if re.search(r'<xf:submit(?:\s|>)', text):
                  errors.append(f'{path}: invalid <xf:submit> tag')
              if re.search(r'\{\{[^}\n]*\$[A-Za-z_][A-Za-z0-9_.]*\s*\[[^\]]+\]', text):
                  errors.append(f'{path}: PHP-style dynamic array access inside expression')
              if re.search(r'\{\$[A-Za-z_][A-Za-z0-9_.]*\s*\[[^\]]+\]', text):
                  errors.append(f'{path}: PHP-style dynamic array access')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          print('XenForo template static validation: OK')
          PY

      - name: Build XenForo installation ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist "${ZIP_NAME}" "${ZIP_NAME}.sha256"
          mkdir -p dist/upload/src/addons/Warext
          cp -a src/addons/Warext/GitHubSync dist/upload/src/addons/Warext/

          rm -rf dist/upload/src/addons/Warext/GitHubSync/_data
          python tools/build-xenforo-release.py dist/upload/src/addons/Warext/GitHubSync

          rm -rf dist/upload/src/addons/Warext/GitHubSync/_output \
                 dist/upload/src/addons/Warext/GitHubSync/_no_upload \
                 dist/upload/src/addons/Warext/GitHubSync/_releases
          rm -f dist/upload/src/addons/Warext/GitHubSync/hashes.json

          cp release/v0.9.3-alpha.12/INSTALL.md dist/KURULUM-INSTALL.md
          cp release/v0.9.3-alpha.12/RELEASE_NOTES.md dist/RELEASE_NOTES.md

          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          upload = Path('dist/upload')
          addon = upload / 'src/addons/Warext/GitHubSync'
          hashes = {}
          for path in sorted(upload.rglob('*')):
              if path.is_file() and path.name != 'hashes.json':
                  hashes[path.relative_to(upload).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (addon / 'hashes.json').write_text(json.dumps(hashes, indent=2) + '\n', encoding='utf-8')
          PY

          (
            cd dist
            zip -qr "../${ZIP_NAME}" upload KURULUM-INSTALL.md RELEASE_NOTES.md
          )
          sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"
          unzip -t "${ZIP_NAME}"
          ! unzip -l "${ZIP_NAME}" | grep -q '/_output/'
          unzip -l "${ZIP_NAME}" | grep -q '_data/admin_navigation.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/admin_permission.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/routes.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/templates.xml'
          unzip -l "${ZIP_NAME}" | grep -q 'hashes.json'

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Warext GitHub Sync v0.9.3 Alpha 12" \
              --notes-file release/v0.9.3-alpha.12/RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Warext GitHub Sync v0.9.3 Alpha 12" \
              --notes-file release/v0.9.3-alpha.12/RELEASE_NOTES.md \
              --prerelease
          fi

      - name: Upload installation assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG}" "${ZIP_NAME}" "${ZIP_NAME}.sha256" --clobber
