name: Publish v0.9.0 Alpha 9 pre-release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-pre-release.yml'
      - 'release/v0.9.0-alpha.9/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v0.9.0-alpha.9
      ZIP_NAME: Warext-GitHub-Sync-v0.9.0-Alpha9-install.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installation ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/upload/src/addons/Warext
          cp -a src/addons/Warext/GitHubSync dist/upload/src/addons/Warext/
          cp release/v0.9.0-alpha.9/INSTALL.md dist/KURULUM-README.md
          (
            cd dist
            zip -qr "../${ZIP_NAME}" upload KURULUM-README.md
          )
          sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"
          unzip -t "${ZIP_NAME}"

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Warext GitHub Sync v0.9.0 Alpha 9" \
              --notes-file release/v0.9.0-alpha.9/RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Warext GitHub Sync v0.9.0 Alpha 9" \
              --notes-file release/v0.9.0-alpha.9/RELEASE_NOTES.md \
              --prerelease
          fi

      - name: Upload installation assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG}" "${ZIP_NAME}" "${ZIP_NAME}.sha256" --clobber
