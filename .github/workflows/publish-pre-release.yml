name: Publish v0.9.2 Alpha 11 pre-release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-pre-release.yml'
      - 'tools/build-xenforo-release.py'
      - 'release/v0.9.2-alpha.11/**'
      - 'src/addons/Warext/GitHubSync/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v0.9.2-alpha.11
      ZIP_NAME: Warext-GitHub-Sync-v0.9.2-Alpha11-install.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build XenForo installation ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist "${ZIP_NAME}" "${ZIP_NAME}.sha256"
          mkdir -p dist/upload/src/addons/Warext
          cp -a src/addons/Warext/GitHubSync dist/upload/src/addons/Warext/

          if grep -R -n -E '<xf:submit([[:space:]>])' dist/upload/src/addons/Warext/GitHubSync/_output/templates; then
            echo 'Invalid XenForo <xf:submit> tag found. Use <xf:submitrow> or <xf:button type="submit"> instead.' >&2
            exit 1
          fi

          rm -rf dist/upload/src/addons/Warext/GitHubSync/_data
          python tools/build-xenforo-release.py dist/upload/src/addons/Warext/GitHubSync

          rm -rf dist/upload/src/addons/Warext/GitHubSync/_output \
                 dist/upload/src/addons/Warext/GitHubSync/_no_upload \
                 dist/upload/src/addons/Warext/GitHubSync/_releases
          rm -f dist/upload/src/addons/Warext/GitHubSync/hashes.json

          cp release/v0.9.2-alpha.11/INSTALL.md dist/KURULUM-INSTALL.md
          cp release/v0.9.2-alpha.11/RELEASE_NOTES.md dist/RELEASE_NOTES.md

          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          upload = Path('dist/upload')
          addon = upload / 'src/addons/Warext/GitHubSync'
          hashes = {}
          for path in sorted(upload.rglob('*')):
              if path.is_file() and path.name != 'hashes.json':
                  hashes[path.relative_to(upload).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (addon / 'hashes.json').write_text(json.dumps(hashes, indent=2) + '\n', encoding='utf-8')
          PY

          (
            cd dist
            zip -qr "../${ZIP_NAME}" upload KURULUM-INSTALL.md RELEASE_NOTES.md
          )
          sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"
          unzip -t "${ZIP_NAME}"
          ! unzip -l "${ZIP_NAME}" | grep -q '/_output/'
          unzip -l "${ZIP_NAME}" | grep -q '_data/admin_navigation.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/admin_permission.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/routes.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/templates.xml'
          unzip -l "${ZIP_NAME}" | grep -q 'hashes.json'

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Warext GitHub Sync v0.9.2 Alpha 11" \
              --notes-file release/v0.9.2-alpha.11/RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Warext GitHub Sync v0.9.2 Alpha 11" \
              --notes-file release/v0.9.2-alpha.11/RELEASE_NOTES.md \
              --prerelease
          fi

      - name: Upload installation assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG}" "${ZIP_NAME}" "${ZIP_NAME}.sha256" --clobber
