name: Publish v1.0.0 stable release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-pre-release.yml'
      - 'tools/build-xenforo-release.py'
      - 'release/v1.0.0/**'
      - 'src/addons/Warext/GitHubSync/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v1.0.0
      ZIP_NAME: Warext-GitHub-Sync-v1.0.0-install.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate XenForo source data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, sys

          addon = Path('src/addons/Warext/GitHubSync')
          templates = addon / '_output/templates'
          errors = []

          addon_meta = json.loads((addon / 'addon.json').read_text(encoding='utf-8'))
          if addon_meta.get('version_string') != '1.0.0':
              errors.append('addon.json version_string must be 1.0.0')
          if addon_meta.get('version_id') != 10000000:
              errors.append('addon.json version_id must be 10000000')

          for path in templates.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if re.search(r'<xf:submit(?:\s|>)', text):
                  errors.append(f'{path}: invalid <xf:submit> tag')
              if re.search(r'\{\{[^}\n]*\$[A-Za-z_][A-Za-z0-9_.]*\s*\[[^\]]+\]', text):
                  errors.append(f'{path}: PHP-style dynamic array access inside expression')
              if re.search(r'\{\$[A-Za-z_][A-Za-z0-9_.]*\s*\[[^\]]+\]', text):
                  errors.append(f'{path}: PHP-style dynamic array access')

          nav_dir = addon / '_output/admin_navigation'
          nav_files = list(nav_dir.glob('*.json'))
          navs = {json.loads(p.read_text(encoding='utf-8'))['navigation_id']: json.loads(p.read_text(encoding='utf-8')) for p in nav_files}
          root = navs.get('wghGitHubSync')
          if not root:
              errors.append('Missing wghGitHubSync root admin navigation')
          else:
              if root.get('parent_navigation_id') != '':
                  errors.append('wghGitHubSync must be top-level')
              if root.get('link') != 'github-sync':
                  errors.append('wghGitHubSync root link must be github-sync')

          expected_children = {
              'wghGitHubSyncDashboard': 'github-sync',
              'wghGitHubSyncConnections': 'github-sync/connections',
              'wghGitHubSyncRepositories': 'github-sync/repositories',
              'wghGitHubSyncMappings': 'github-sync/mappings',
              'wghGitHubSyncTemplates': 'github-sync/templates',
              'wghGitHubSyncActions': 'github-sync/actions',
              'wghGitHubSyncPullRequests': 'github-sync/pull-requests',
              'wghGitHubSyncXfrm': 'github-sync/xfrm',
              'wghGitHubSyncHealth': 'github-sync/health',
              'wghGitHubSyncUsers': 'github-sync/user-mappings',
              'wghGitHubSyncConflicts': 'github-sync/conflicts',
              'wghGitHubSyncDeliveries': 'github-sync/deliveries',
              'wghGitHubSyncDiagnostics': 'github-sync/diagnostics',
          }
          for nav_id, link in expected_children.items():
              nav = navs.get(nav_id)
              if not nav:
                  errors.append(f'Missing admin navigation child: {nav_id}')
                  continue
              if nav.get('parent_navigation_id') != 'wghGitHubSync':
                  errors.append(f'{nav_id}: wrong parent_navigation_id')
              if nav.get('link') != link:
                  errors.append(f'{nav_id}: wrong link')
              if nav.get('admin_permission_id') != 'wghManage':
                  errors.append(f'{nav_id}: wrong admin permission')

          route = json.loads((addon / '_output/routes/admin/github-sync.json').read_text(encoding='utf-8'))
          if route.get('context') != 'wghGitHubSync':
              errors.append('Admin route context must be wghGitHubSync')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f'XenForo stable source validation: OK ({len(expected_children)} child navigation entries)')
          PY

      - name: Build XenForo installation ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist "${ZIP_NAME}" "${ZIP_NAME}.sha256"
          mkdir -p dist/upload/src/addons/Warext
          cp -a src/addons/Warext/GitHubSync dist/upload/src/addons/Warext/

          rm -rf dist/upload/src/addons/Warext/GitHubSync/_data
          python tools/build-xenforo-release.py dist/upload/src/addons/Warext/GitHubSync

          rm -rf dist/upload/src/addons/Warext/GitHubSync/_output \
                 dist/upload/src/addons/Warext/GitHubSync/_no_upload \
                 dist/upload/src/addons/Warext/GitHubSync/_releases
          rm -f dist/upload/src/addons/Warext/GitHubSync/hashes.json

          cp release/v1.0.0/INSTALL.md dist/KURULUM-INSTALL.md
          cp release/v1.0.0/RELEASE_NOTES.md dist/RELEASE_NOTES.md

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as ET

          upload = Path('dist/upload')
          addon = upload / 'src/addons/Warext/GitHubSync'

          nav_root = ET.parse(addon / '_data/admin_navigation.xml').getroot()
          nav_items = list(nav_root)
          if len(nav_items) < 14:
              raise SystemExit(f'Expected at least 14 admin navigation records, found {len(nav_items)}')
          route_text = (addon / '_data/routes.xml').read_text(encoding='utf-8')
          if 'wghGitHubSync' not in route_text:
              raise SystemExit('Built routes.xml does not contain wghGitHubSync section context')

          for xml_path in (addon / '_data').glob('*.xml'):
              ET.parse(xml_path)

          hashes = {}
          for path in sorted(upload.rglob('*')):
              if path.is_file() and path.name != 'hashes.json':
                  hashes[path.relative_to(upload).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (addon / 'hashes.json').write_text(json.dumps(hashes, indent=2) + '\n', encoding='utf-8')
          print(f'Stable package validation: {len(nav_items)} admin navigation records, {len(hashes)} hashed files')
          PY

          (
            cd dist
            zip -qr "../${ZIP_NAME}" upload KURULUM-INSTALL.md RELEASE_NOTES.md
          )
          sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"
          unzip -t "${ZIP_NAME}"
          ! unzip -l "${ZIP_NAME}" | grep -q '/_output/'
          unzip -l "${ZIP_NAME}" | grep -q '_data/admin_navigation.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/admin_permission.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/routes.xml'
          unzip -l "${ZIP_NAME}" | grep -q '_data/templates.xml'
          unzip -l "${ZIP_NAME}" | grep -q 'hashes.json'

      - name: Create or update stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Warext GitHub Sync v1.0.0" \
              --notes-file release/v1.0.0/RELEASE_NOTES.md \
              --prerelease=false \
              --latest
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Warext GitHub Sync v1.0.0" \
              --notes-file release/v1.0.0/RELEASE_NOTES.md \
              --latest
          fi

      - name: Upload stable installation assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG}" "${ZIP_NAME}" "${ZIP_NAME}.sha256" --clobber
