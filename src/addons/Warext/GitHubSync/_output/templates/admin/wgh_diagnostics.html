<xf:title>GitHub Sync diagnostics</xf:title><xf:macro template="wgh_macros" name="nav" arg-selected="diagnostics" />
<div class="block"><div class="block-container"><div class="block-body"><table class="dataList"><thead><tr class="dataList-row"><th class="dataList-cell">Check</th><th class="dataList-cell">Result</th><th class="dataList-cell">Details</th></tr></thead><tbody>
<xf:foreach loop="$checks" value="$check"><tr class="dataList-row"><td class="dataList-cell">{$check.name}</td><td class="dataList-cell">{{ $check.ok ? 'OK' : 'FAILED' }}</td><td class="dataList-cell">{$check.detail}</td></tr></xf:foreach>
</tbody></table></div></div></div>
