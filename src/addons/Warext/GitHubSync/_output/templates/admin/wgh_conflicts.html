<xf:title>Synchronization conflicts</xf:title>
<xf:macro template="wgh_macros" name="nav" arg-selected="conflicts" />
<div class="block"><div class="block-container"><div class="block-body">
<div class="block-row"><a href="{{ link('github-sync/conflicts', null, {'status':'pending'}) }}">Pending</a> · <a href="{{ link('github-sync/conflicts', null, {'status':'resolved'}) }}">Resolved</a> · <a href="{{ link('github-sync/conflicts', null, {'status':'dismissed'}) }}">Dismissed</a> · <a href="{{ link('github-sync/conflicts', null, {'status':'all'}) }}">All</a></div>
<table class="dataList"><thead><tr class="dataList-row"><th class="dataList-cell">Object</th><th class="dataList-cell">XenForo</th><th class="dataList-cell">Status</th><th class="dataList-cell">Resolution</th><th class="dataList-cell">Created</th></tr></thead><tbody>
<xf:foreach loop="$conflicts" value="$conflict"><tr class="dataList-row">
<td class="dataList-cell"><a href="{{ link('github-sync/conflict', null, {'conflict_id': $conflict.conflict_id}) }}">{$conflict.github_type}: {$conflict.github_id}</a></td>
<td class="dataList-cell">{$conflict.xf_content_type} #{$conflict.xf_content_id}</td><td class="dataList-cell">{$conflict.status}</td><td class="dataList-cell">{$conflict.resolution}</td><td class="dataList-cell"><xf:date time="$conflict.created_date" /></td>
</tr></xf:foreach></tbody></table>
</div></div></div>
