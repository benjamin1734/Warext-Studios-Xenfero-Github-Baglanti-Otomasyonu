<xf:title>Warext GitHub Sync - XFRM mappings</xf:title>
<xf:macro template="wgh_macros" name="nav" arg-selected="xfrm" />
<div class="block"><div class="block-container"><h2 class="block-header">Release → Resource mappings</h2><div class="block-body"><table class="dataList"><thead><tr class="dataList-row"><th class="dataList-cell">Mapping</th><th class="dataList-cell">Repository</th><th class="dataList-cell">Enabled</th><th class="dataList-cell">Resource ID</th><th class="dataList-cell"></th></tr></thead><tbody>
<xf:foreach loop="$mappings" value="$mapping"><tr class="dataList-row"><td class="dataList-cell">{$mapping.title}</td><td class="dataList-cell">#{$mapping.repository_id}</td><td class="dataList-cell">{{ $mapping.target_config.xfrm_enabled ? 'Yes' : 'No' }}</td><td class="dataList-cell">{$mapping.target_config.xfrm_resource_id}</td><td class="dataList-cell"><a href="{{ link('github-sync/xfrm-mapping-edit', null, {'mapping_id': $mapping.mapping_id}) }}">Configure</a></td></tr></xf:foreach>
</tbody></table></div></div></div>
