<xf:title>Webhook delivery logs</xf:title><xf:macro template="wgh_macros" name="nav" arg-selected="deliveries" />
<div class="block"><div class="block-container"><div class="block-body"><table class="dataList"><thead><tr class="dataList-row"><th class="dataList-cell">Delivery</th><th class="dataList-cell">Event</th><th class="dataList-cell">Ref</th><th class="dataList-cell">Status</th><th class="dataList-cell">Attempts</th><th class="dataList-cell">Received</th></tr></thead><tbody>
<xf:foreach loop="$deliveries" value="$delivery"><tr class="dataList-row"><td class="dataList-cell"><a href="{{ link('github-sync/delivery', null, {'delivery_id': $delivery.delivery_id}) }}">{$delivery.github_delivery_guid}</a></td><td class="dataList-cell">{$delivery.github_event}.{$delivery.event_action}</td><td class="dataList-cell">{$delivery.source_ref}</td><td class="dataList-cell">{$delivery.status}</td><td class="dataList-cell">{$delivery.attempt_count}</td><td class="dataList-cell"><xf:date time="$delivery.received_date" /></td></tr></xf:foreach>
</tbody></table></div></div></div>
<xf:pagenav page="$page" perpage="$perPage" total="$total" link="github-sync/deliveries" params="{{ {'status': $status} }}" wrapperclass="block" />
