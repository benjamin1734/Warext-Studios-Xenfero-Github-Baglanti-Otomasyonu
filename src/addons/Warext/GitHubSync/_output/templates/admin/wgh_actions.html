<xf:title>GitHub Actions</xf:title>
<xf:macro template="wgh_macros" name="nav" arg-selected="actions" />

<xf:form action="{{ link('github-sync/actions') }}" method="get" class="block">
	<div class="block-container">
		<h2 class="block-header">Repository workflows</h2>
		<div class="block-body">
			<xf:selectrow name="repository_id" value="{$repositoryId}" label="Repository">
				<xf:option value="0">Select repository</xf:option>
				<xf:foreach loop="$repositories" value="$repository"><xf:option value="{$repository.repository_id}">{$repository.full_name}</xf:option></xf:foreach>
			</xf:selectrow>
		</div>
		<xf:submitrow submit="Load workflows" />
	</div>
</xf:form>

<xf:if is="$error">
	<div class="blockMessage blockMessage--error">{$error}</div>
</xf:if>

<xf:if is="$selectedRepository && !$error">
	<div class="block">
		<div class="block-container">
			<h2 class="block-header">{$selectedRepository.full_name}</h2>
			<div class="block-body">
				<xf:if is="$workflows is not empty">
					<xf:foreach loop="$workflows" value="$workflow">
						<xf:form action="{{ link('github-sync/workflow-dispatch') }}" ajax="true" class="block-row block-row--separated">
							<input type="hidden" name="repository_id" value="{$selectedRepository.repository_id}" />
							<input type="hidden" name="workflow_id" value="{$workflow.id}" />
							<div class="contentRow">
								<div class="contentRow-main">
									<h3 class="contentRow-title">{$workflow.name}</h3>
									<div class="contentRow-minor">{$workflow.path} · {$workflow.state}</div>
									<xf:textboxrow name="ref" value="{$selectedRepository.default_branch}" label="Ref" />
									<xf:textarearow name="inputs_json" value="{}" label="Inputs JSON" explain="Optional workflow_dispatch inputs object." autosize="true" />
									<xf:submitrow submit="Run workflow" />
								</div>
							</div>
						</xf:form>
					</xf:foreach>
				<xf:else />
					<div class="block-row">No workflows were returned for this repository.</div>
				</xf:if>
			</div>
		</div>
	</div>
</xf:if>
